name: NimblePods FOSS Debug APK

'on':
  push:
    branches:
      - feature/podsphere-bootstrap
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foss-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | sdkmanager --licenses || true
          set -o pipefail

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-37.0" # corrected: SDK repository exposes Android 37 as android-37.0
            "build-tools;37.0.0" \
            "ndk;30.0.14904198" \
            "cmake;3.22.1"

      - name: Add Android 37 platform alias for AGP
        run: |
          platform_dir="${ANDROID_SDK_ROOT}/platforms"
          if [ -d "${platform_dir}/android-37.0" ] && \
             [ ! -e "${platform_dir}/android-37" ] && \
             [ ! -L "${platform_dir}/android-37" ]; then
            ln -s android-37.0 "${platform_dir}/android-37"
          fi

      - name: Cache Gradle and Android build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ubuntu-latest-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*', 'android/gradle.properties', 'android/**/gradle/libs.versions.toml') }}

      - name: Build fossDebug APK
        working-directory: android
        run: ./gradlew :app:assembleFossDebug --no-daemon --warning-mode all 2>&1 | tee build.log

      - name: Upload fossDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: nimblepods-fossDebug-${{ github.sha }}
          path: '**/build/outputs/apk/foss/debug/*.apk'
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nimblepods-fossDebug-build-log-${{ github.sha }}
          path: android/build.log
          if-no-files-found: warn
          retention-days: 14
