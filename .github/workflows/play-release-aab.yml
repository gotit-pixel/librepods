name: NimblePods Play Release AAB

'on':
  push:
    branches:
      - feature/podsphere-bootstrap
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-release-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | sdkmanager --licenses || true
          set -o pipefail

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;30.0.14904198" \
            "cmake;3.22.1"

      - name: Add Android 37 platform alias for AGP
        run: |
          platform_dir="${ANDROID_SDK_ROOT}/platforms"
          if [ -d "${platform_dir}/android-37.0" ] && \
             [ ! -e "${platform_dir}/android-37" ] && \
             [ ! -L "${platform_dir}/android-37" ]; then
            ln -s android-37.0 "${platform_dir}/android-37"
          fi
          test -d "${platform_dir}/android-37"

      - name: Cache Gradle and Android build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ubuntu-latest-play-release-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*', 'android/gradle.properties', 'android/**/gradle/libs.versions.toml') }}

      - name: Validate release signing secrets
        env:
          RELEASE_KEYSTORE_FILE: ${{ secrets.RELEASE_KEYSTORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in RELEASE_KEYSTORE_FILE RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Decode and verify upload keystore
        env:
          RELEASE_KEYSTORE_FILE: ${{ secrets.RELEASE_KEYSTORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_FILE" | base64 --decode > android/release.keystore
          test -s android/release.keystore
          keytool -list -keystore android/release.keystore \
            -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null
          chmod 600 android/release.keystore

      - name: Configure Gradle release signing
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          {
            printf 'RELEASE_STORE_FILE=release.keystore\n'
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$RELEASE_KEY_PASSWORD"
          } > android/local.properties

      - name: Build signed Play release AAB
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:bundlePlayRelease --no-daemon --warning-mode all 2>&1 | tee build-play.log

      - name: Upload Play release AAB
        uses: actions/upload-artifact@v4
        with:
          name: nimblepods-play-release-${{ github.sha }}
          path: android/app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nimblepods-play-release-build-log-${{ github.sha }}
          path: android/build-play.log
          if-no-files-found: warn
          retention-days: 14
